  - { url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml" }

atom: []

# Sitemaps can each expand to tens of thousands of URLs — add deliberately.
# Example: - { url: "https://example.com/sitemap.xml" }
sitemaps: []
