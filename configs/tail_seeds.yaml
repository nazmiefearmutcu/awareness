# Awareness tail seeds — public RSS/Atom feeds & sitemaps polled live.
#
# The tail engine re-polls each of these every `tail_poll_seconds` and captures
# newly-published text. This is a broad, reputable default set; add your own
# (or run `awareness tail start --gdelt` to also follow the GDELT global-news
# firehose, which discovers ~all news article URLs worldwide).
#
# Each entry: { url: "https://…" }. `feeds` covers RSS & Atom alike.

feeds:
  # ── World / general news ────────────────────────────────────────────────
  - { url: "https://feeds.bbci.co.uk/news/rss.xml" }
  - { url: "https://feeds.bbci.co.uk/news/world/rss.xml" }
  - { url: "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml" }
  - { url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml" }
  - { url: "https://www.theguardian.com/world/rss" }
  - { url: "https://www.theguardian.com/international/rss" }
  - { url: "https://www.aljazeera.com/xml/rss/all.xml" }
  - { url: "https://feeds.npr.org/1001/rss.xml" }
  - { url: "http://rss.cnn.com/rss/edition.rss" }
  - { url: "https://rss.dw.com/rdf/rss-en-all" }
  - { url: "https://www.france24.com/en/rss" }
  - { url: "https://www.cbc.ca/cmlink/rss-topstories" }
  - { url: "https://feeds.skynews.com/feeds/rss/world.xml" }

  # ── Politics ──────────────────────────────────────────────────────────────
