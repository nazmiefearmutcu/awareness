# aw-fin-1: awareness finance sentiment lexicon (hand-curated, original word lists).
#
# Keys are lower-cased terms or phrases. A key may list alternative surface forms
# separated by "|" (for example "surge|surges|surged"); every alternative receives the
# same weight. Phrases are matched greedily before single words, so a phrase entry
# overrides the words it contains. Weight 0 entries are blockers: they consume their
# tokens without contributing a hit (for example "by default").
#
# Weights are roughly in [-3, +3]. Negators flip and dampen a hit (x -0.6); intensifiers
# scale it (x 1.4). See awareness.markets.nlp.lexicon for the scoring rules.

version: aw-fin-1

