# Rule-based finance taxonomy: asset classes, topics, negative (non-finance) classes,
# horizon hints and content-type prefixes. Aliases are matched on folded text
# (case-, accent- and Turkish-dotless-i-insensitive, word boundaries), so write them naturally.
# Scoring is done in nlp/taxonomy.py: title alias = 2 x weight, body alias = 1 x weight.

# Entity types that imply an asset class (entity evidence), plus alias hits per class.
asset_classes:
  equities:
    entity_types: [equity]
    aliases: [stock, stocks, shares, equity, equities, stock market, share price, hisse, hisseler, hisse senedi, borsa]
  indices:
    entity_types: [index]
    aliases: [index, indices, stock index, benchmark index, endeks, endeksi, s&p 500, nasdaq composite, bist 100, dow jones, ftse, nikkei, stoxx]
  fx:
    entity_types: [fx]
    aliases: [currency, currencies, forex, foreign exchange, exchange rate, dollar, euro, yen, lira, sterling, dolar, döviz, kur, avro, fx]
  rates:
    entity_types: [central_bank]
    aliases: [interest rate, interest rates, rate cut, rate hike, bond yield, bond yields, treasury yield, treasuries, treasury, government bond, gilt, bund, faiz, faiz oranı, politika faizi, tahvil, bono]
  credit:
    entity_types: []
    aliases: [credit spread, credit spreads, high yield, junk bond, junk bonds, corporate bond, corporate bonds, investment grade, default risk, eurobond, kredi riski]
  commodities:
    entity_types: [commodity]
    aliases: [commodity, commodities, emtia, oil, crude, gold, silver, copper, natural gas, wheat, corn, metals, altın, doğalgaz, bakır, gümüş]
  crypto:
    entity_types: [crypto]
    aliases: [crypto, cryptocurrency, bitcoin, ethereum, stablecoin, altcoin, blockchain, defi, kripto]
  macro:
    entity_types: []
    aliases: [economy, economic, gdp, inflation, unemployment, recession, economic growth, ekonomi, enflasyon, büyüme, makro, macro]

# Phrases that look like a topic but are not (removed from that topic's text only).
topic_exclusions:
  dividends_buybacks: [repurchase agreement, repurchase agreements, repo, repos]

# Entity types that add evidence to one topic (score +1.5 when entity confidence >= 0.8).
entity_topic_hints:
  central_bank: central_bank

