horizon:
  # Market-moving, live language -> intraday.
  intraday: [flash, breaking, halted, trading halt, halts trading, plunges, surges, tumbles, soars, skyrockets, live, just in, son dakika, anlık, anlik]
  # Topics and release names that point at a one-week horizon.
  one_week_topics: [earnings, guidance, central_bank]
  one_week_aliases: [cpi, pce, nonfarm payrolls, jobs report, pmi, retail sales, rate decision, fomc meeting, enflasyon verisi, faiz kararı, faiz karari]
  # Topics whose effects are long-run.
  structural_topics: [regulation, litigation, supply_chain, geopolitics, sanctions, trade_tariffs]

macro_topics: [inflation, employment, growth_recession, consumer, housing, fiscal_policy, trade_tariffs]

# Publisher kinds and feed categories that raise or lower finance relevance.
publisher_relevance:
  boost: [official, regulator, financial_press, specialist]
  penalty: [community]
feed_relevance_categories: [markets, economy, earnings, crypto, central_bank]

# Content-type hints taken from title prefixes (folded, case-insensitive).
content_type:
  opinion_prefixes: [opinion, column, commentary, editorial, letters, letter, görüş, gorus, köşe yazısı, kose yazisi]
  analysis_prefixes: [analysis, explainer, deep dive, analiz]
  analysis_patterns: ["^what .* means\\b"]
