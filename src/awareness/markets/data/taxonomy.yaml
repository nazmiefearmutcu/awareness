    aliases: [football, soccer, basketball, tennis, cricket, champions league, premier league, la liga, nba, nfl, mlb, world cup, olympics, goalkeeper, striker, transfer window, league match, football match, futbol, basketbol, maç, şampiyonlar ligi, super lig, süper lig]
