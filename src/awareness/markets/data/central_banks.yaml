# Hand-maintained central-bank schedules for banks whose official calendar is
# not machine-reachable (see load_curated_schedules).
#
# Each entry needs: provider, country, currency, title, date (YYYY-MM-DD),
# time ("HH:MM" quoted, local to tz; or null for an all-day event), tz (IANA zone),
# source_url (the official page the date was read from) and verified_on
# (YYYY-MM-DD, the day the date was checked against that page).
# Only add a date after checking it on the official page. Never extrapolate.
#
# TCMB (Turkey, PPK): source is the official "2026 Para Politikasi" policy text,
# Annex 2 "Ek 2: PPK Toplantilari ve Rapor Takvimi", corroborated by the TCMB
# PPK/2026 page. Section 13 of the same text: decisions are published on the
# meeting day at 14:00 Istanbul time (UTC+3 all year). The second half of 2027 is
# not published yet (2027 policy text due 2026-12-18), so nothing after 2027-06-10.

