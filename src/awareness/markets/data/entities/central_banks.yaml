# Central banks. Each one also emits its home country as an implied, dampened country entity
# (confidence 0.7, salience x0.5 when the country is only implied).
banks:
  - id: FED
    country: US
    aliases:
      - Federal Reserve
      - {text: Fed, exclude_next: [up, down]}
      - FOMC
      - Federal Open Market Committee
      - ABD Merkez Bankası
      - ABD Merkez Bankasi
      - Amerikan Merkez Bankası
  - id: ECB
    country: EU
    aliases: [European Central Bank, ECB, Avrupa Merkez Bankası, Avrupa Merkez Bankasi, AMB]
  - id: BOE
    country: GB
    aliases: [Bank of England, BoE, BOE, İngiltere Merkez Bankası, Ingiltere Merkez Bankasi]
  - id: BOJ
    country: JP
    aliases: [Bank of Japan, BoJ, BOJ, Japonya Merkez Bankası, Japonya Merkez Bankasi]
  - id: PBOC
    country: CN
    aliases: ["People's Bank of China", PBOC, PBoC, Çin Merkez Bankası, Cin Merkez Bankasi]
  - id: SNB
    country: CH
    aliases: [Swiss National Bank, SNB, İsviçre Merkez Bankası, Isvicre Merkez Bankasi]
  - id: BOC
    country: CA
    aliases: [Bank of Canada, BoC]
  - id: RBA
    country: AU
    aliases: [Reserve Bank of Australia, RBA]
  - id: RBNZ
    country: NZ
    aliases: [Reserve Bank of New Zealand, RBNZ]
  - id: RIKSBANK
    country: SE
    aliases: [Riksbank]
  - id: NORGES
    country: NO
    aliases: [Norges Bank]
  - id: RBI
    country: IN
    aliases: [Reserve Bank of India, RBI, Hindistan Merkez Bankası]
  - id: TCMB
    country: TR
    aliases:
      - Central Bank of the Republic of Turkey
      - Central Bank of Turkey
      - CBRT
      - TCMB
      # Bare "Merkez Bankası" means TCMB in Turkish copy — except when a country/region precedes it
      # ("Avrupa Merkez Bankası" = ECB, "Çin Merkez Bankası" = PBOC, …); those have their own aliases.
      - {text: Merkez Bankası, exclude_prev: [Avrupa, Çin, Cin, Japonya, İngiltere, Ingiltere, İsviçre, Isvicre, Rusya, ABD, Amerikan, Amerika, Kanada, Avustralya, Hindistan, Brezilya, Çekya, Cekya, Çek, Polonya, Macaristan, Meksika, Kore, Norveç, Norvec, İsveç, Isvec, Mısır, Misir, Suudi, Endonezya, Arjantin, Şili, Sili, Kolombiya, Peru, Ukrayna, İsrail, Israil, Pakistan, Nijerya, Kazakistan, Azerbaycan, Gürcistan, Yunanistan, Romanya, Bulgaristan, Sırbistan, Danimarka, Tayvan, Singapur, Malezya, Tayland, Filipinler, Vietnam, Katar, Kuveyt, Emirlikleri, İran, Iran, Irak, Lübnan, Tunus, Fas, Cezayir, Kenya, Gana, Güney, Yeni, İskoçya, Avro, Bölge, bölgesi, ülke, ülkelerin, merkez, hangi]}
      - {text: Merkez Bankasi, exclude_prev: [Avrupa, Çin, Cin, Japonya, İngiltere, Ingiltere, İsviçre, Isvicre, Rusya, ABD, Amerikan, Amerika, Kanada, Avustralya, Hindistan, Brezilya, Çekya, Cekya, Çek, Polonya, Macaristan, Meksika, Kore, Norveç, Norvec, İsveç, Isvec, Mısır, Misir, Suudi, Endonezya, Arjantin, Şili, Sili, Kolombiya, Peru, Ukrayna, İsrail, Israil, Pakistan, Nijerya, Kazakistan, Azerbaycan, Gürcistan, Yunanistan, Romanya, Bulgaristan, Sırbistan, Danimarka, Tayvan, Singapur, Malezya, Tayland, Filipinler, Vietnam, Katar, Kuveyt, Emirlikleri, İran, Iran, Irak, Lübnan, Tunus, Fas, Cezayir, Kenya, Gana, Güney, Yeni, İskoçya, Avro, Bölge, bölgesi, ülke, ülkelerin, merkez, hangi]}
      - Cumhuriyet Merkez Bankası
      - Türkiye Cumhuriyet Merkez Bankası
  - id: BANXICO
    country: MX
    aliases: [Banxico, Bank of Mexico]
  - id: BCB
    country: BR
    aliases: [Central Bank of Brazil, BCB]
