# Large Borsa Istanbul (BIST) names. id = <code>.IS (Yahoo-style, as the terminal uses).
# Bare upper-case codes (THYAO) count only when followed within three tokens by a Turkish
# market word (hisse, hisseleri, pay, payları, BIST, borsa); cashtags and exchange-qualified
# forms such as (BIST: THYAO) always count.
issuers:
  - {code: THYAO, name: Türk Hava Yolları, aliases: [Türk Hava Yolları, Turk Hava Yollari, Turkish Airlines, THY]}
  - {code: ASELS, name: Aselsan, aliases: [Aselsan]}
  - {code: GARAN, name: Garanti BBVA, aliases: [Garanti BBVA, Garanti Bankası, Garanti Bankasi]}
