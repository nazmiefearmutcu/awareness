# Crypto assets. id = symbol (BTC, ETH, SOL ...).
# Names are proper nouns: matched only when capitalised (default for every coin).
# ambiguous_names: the name is also an ordinary word or a brand, so it needs a crypto context
#   word in the same sentence ("optimism", "Stacks of cash", "Dash" pricing).
# ambiguous_symbol: the upper-case ticker collides with an ordinary abbreviation or an equity
#   ticker, so the bare symbol needs crypto context in the same sentence (a cashtag always works).
# Full names match at 0.9; upper-case symbols at 0.85 (cashtags always 0.99). A symbol that is
# also a known SEC ticker never yields a crypto hit without a cashtag.
coins:
  - {symbol: BTC, names: [Bitcoin]}
  - {symbol: ETH, names: [Ethereum, Ether]}
  - {symbol: SOL, names: [Solana], ambiguous_symbol: true}
  - {symbol: XRP, names: [XRP, Ripple], ambiguous_names: true}
  - {symbol: BNB, names: [BNB, Binance Coin]}
  - {symbol: ADA, names: [Cardano], ambiguous_names: true}
  - {symbol: DOGE, names: [Dogecoin]}
  - {symbol: TRX, names: [Tron], ambiguous_names: true, ambiguous_symbol: true}
  - {symbol: TON, names: [Toncoin], ambiguous_symbol: true}
