# Crypto assets. id = symbol (BTC, ETH, SOL ...).
# ambiguous_symbol: the ticker is also an ordinary word or abbreviation, so the bare
#   upper-case symbol needs a crypto context word in the same sentence (or a cashtag).
# capital: the full name is a common English word, so it must be capitalised in the text.
# Full names match at 0.9; upper-case symbols at 0.85 (cashtags always 0.99).
coins:
  - {symbol: BTC, names: [Bitcoin], capital: false}
  - {symbol: ETH, names: [Ethereum, Ether], capital: false}
  - {symbol: SOL, names: [Solana], ambiguous_symbol: true}
  - {symbol: XRP, names: [XRP, Ripple], capital: true}
  - {symbol: BNB, names: [BNB, Binance Coin]}
