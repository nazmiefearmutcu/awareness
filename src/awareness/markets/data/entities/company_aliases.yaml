# Curated company names -> US ticker (SEC convention: dots become dashes).
# Alias forms:
#   - plain string              -> unambiguous name, 0.9 confidence, capitalised surface form required
#   - {text, ambiguous: true}   -> ordinary word; needs a context word in the same sentence, 0.8
#   - {text, context: [...]}    -> overrides the default context list for that alias
#   - {text, exclude_next: [...]} / {text, exclude_prev: [...]} -> reject when a neighbour matches
# Entries are hand-maintained, so provenance is "curated".
companies:
  - id: AAPL
    name: Apple Inc.
    aliases:
      - Apple Inc
      - {text: Apple, exclude_next: [pie, pies, juice, cider, sauce, cake, cakes, seeds, orchard, orchards]}
