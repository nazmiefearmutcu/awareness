# Curated publisher registry (allowlist) for awareness.markets.
# Tier: 1 official + top wires · 2 major financial press · 3 quality general/regional/specialist
#       4 aggregators, PR wires, opinion/contributor platforms · 5 community/social
# Every feed URL below was fetched live on 2026-11-08 and returned >= 1 entry with link + title.
# `profile: browser` is used only where the bot user agent was refused.
# Publishers with `feeds: []` are allowlisted origins for Google News only (no public RSS).
publishers:
  # ── tier 1: official sources and top wires ───────────────────────────
  - id: federal_reserve
    name: Federal Reserve
    domain: federalreserve.gov
    tier: 1
    kind: official
    region: US
    fetch_fulltext: true
    feeds:
      - {id: fed.press_all, url: "https://www.federalreserve.gov/feeds/press_all.xml", categories: [central_bank, rates], poll_seconds: 300}
      - {id: fed.speeches, url: "https://www.federalreserve.gov/feeds/speeches.xml", categories: [central_bank], poll_seconds: 600}
