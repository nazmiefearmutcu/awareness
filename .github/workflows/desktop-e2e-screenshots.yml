# Run Awareness desktop on real Windows + Linux runners and capture boot UI screenshots.
name: Desktop E2E Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - feat/desktop-win-linux
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-e2e-screenshots.yml"

permissions:
  contents: read

jobs:
  linux-e2e:
    name: Linux AppImage + tar boot UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps + xvfb tools
        working-directory: desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils scrot imagemagick
          npm ci || npm install

      - name: Build Linux packages
        working-directory: desktop
        run: npm run dist:linux

      - name: Mock API + launch + screenshots + deb install
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p ../e2e-out

          python3 scripts/mock_api_server.py >../e2e-out/mock-api.log 2>&1 &
          MOCK_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8085/healthz; then
              echo " mock up"
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8085/healthz

          APPIMAGE=$(ls dist-native/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          TAR=$(ls dist-native/*.tar.gz | head -1)
          mkdir -p /tmp/aw-linux
          tar -xzf "$TAR" -C /tmp/aw-linux
          BIN=$(find /tmp/aw-linux -type f -name 'awareness-desktop' | head -1)
          chmod +x "$BIN"

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 1

          "$BIN" --no-sandbox --disable-gpu 2>../e2e-out/linux-app.log &
          APP_PID=$!
          sleep 10
          scrot ../e2e-out/linux-boot-or-dashboard.png || import -window root ../e2e-out/linux-boot-or-dashboard.png || true
          sleep 2
          scrot ../e2e-out/linux-ui-2.png || true

          kill "$APP_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          ls -lah "$APPIMAGE" | tee ../e2e-out/linux-appimage-ls.txt
          file "$APPIMAGE" | tee ../e2e-out/linux-appimage-file.txt

          DEB=$(ls dist-native/*.deb | head -1)
          dpkg-deb -I "$DEB" | tee ../e2e-out/linux-deb-info.txt
          # Avoid SIGPIPE under `set -o pipefail` when head closes early.
          set +o pipefail
          dpkg-deb -c "$DEB" | head -50 | tee ../e2e-out/linux-deb-contents.txt
          set -o pipefail
          sudo dpkg -i "$DEB" || sudo apt-get install -f -y
          ls /usr/share/applications/*wareness* 2>/dev/null | tee ../e2e-out/linux-desktop-entry-path.txt || true
          cat /usr/share/applications/*wareness*.desktop 2>/dev/null | tee ../e2e-out/linux-desktop-entry.txt || true

          kill "$MOCK_PID" 2>/dev/null || true
          ls -la ../e2e-out | tee ../e2e-out/listing.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux-screenshots
          path: e2e-out/**
          if-no-files-found: warn

  windows-e2e:
    name: Windows NSIS install + boot UI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci || npm install

      - name: Build Windows packages
        working-directory: desktop
        run: npm run dist:win

      - name: Mock API + portable launch + NSIS smoke + screenshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path e2e-out | Out-Null

          $mock = Start-Process python -ArgumentList "desktop/scripts/mock_api_server.py" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 2
          $health = Invoke-WebRequest -Uri http://127.0.0.1:8085/healthz -UseBasicParsing
          $health.Content | Tee-Object e2e-out/windows-health.txt

          # Prefer portable zip for UI test (NSIS /S can hang on runners waiting for elevation UI).
          $zip = Get-ChildItem desktop/dist-native/*.zip | Select-Object -First 1
          if (-not $zip) { throw "No Windows zip found" }
          Expand-Archive -Path $zip.FullName -DestinationPath e2e-out/win-portable -Force
          Get-ChildItem e2e-out/win-portable | Out-File e2e-out/windows-portable-listing.txt
          $bin = Get-ChildItem e2e-out/win-portable -Filter Awareness.exe -Recurse | Select-Object -First 1
          if (-not $bin) { throw "Awareness.exe missing from portable zip" }
          "bin=$($bin.FullName)" | Tee-Object e2e-out/windows-bin.txt

          $proc = Start-Process -FilePath $bin.FullName -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$pwd\e2e-out\windows-boot-or-dashboard.png")
          $g.Dispose(); $bmp.Dispose()
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

          # NSIS smoke: start silent install with timeout (do not fail whole job if hung)
          $exe = Get-ChildItem desktop/dist-native/*.exe |
            Where-Object { $_.Name -like 'Awareness-*-win-*.exe' -and $_.Name -notlike '*.blockmap' } |
            Select-Object -First 1
          if ($exe) {
            "Installer=$($exe.FullName)" | Tee-Object e2e-out/windows-installer.txt
            $dest = Join-Path $env:TEMP "AwarenessNsisTest"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S","/D=$dest" -PassThru
            if (-not $p.WaitForExit(120000)) {
              "nsis_timeout=1" | Tee-Object e2e-out/windows-nsis-exit.txt
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            } else {
              "nsis_exit=$($p.ExitCode)" | Tee-Object e2e-out/windows-nsis-exit.txt
            }
            if (Test-Path (Join-Path $dest "Awareness.exe")) {
              "nsis_installed=1" | Tee-Object e2e-out/windows-nsis-installed.txt
            } else {
              "nsis_installed=0" | Tee-Object e2e-out/windows-nsis-installed.txt
            }
          }

          if (-not $mock.HasExited) { Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue }
          Get-ChildItem e2e-out | Out-File e2e-out/listing.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows-screenshots
          path: e2e-out/**
          if-no-files-found: warn
